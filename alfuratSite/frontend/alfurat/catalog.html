<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alfurat - Качественная мебель для вашего дома</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <section class="hotbar">
    <div class="logo">
      <h1>Alfurat<span>.tj</span></h1>
    </div>
    <nav class="catalog-nav">
      <ul>
        <li><a href="index.html">Вернуться на главное Меню</a></li>
      </ul>
    </nav>
    </div>
  </section>
  <div class="hiddenModal"></div>


  <section class="catalog">
    <div class="container">
      <h2>Каталог мебели</h2>
      <p>Выберите мебель которая вас интересует</p>
      <div class="categories">
        <button class="category-btn active">Вся мебель</button>
        <button class="category-btn">Кухня</button>
        <button class="category-btn">Гостиная</button>
        <button class="category-btn">Спальня</button>
        <button class="category-btn">Детская</button>
        <button class="category-btn">Офисная</button>
        <button class="category-btn">Гардеробная</button>
      </div>
      <div class="products-grid">
        <!-- Товары будут подгружаться динамически или добавляться вручную -->
        <div class="product-item">
          <img class="product-img"
            src="https://avatars.mds.yandex.net/i?id=cb7a5b2f3a4660f0f44099fccf85a83fae85cea1-9601511-images-thumbs&n=13"
            alt="Кухня">
          <h3 class="id-items">Кухня</h3>
          <!--ID обязательно писать категорию без ошибок для распределения по категориям -->
          <p class="price"> 45 000 ₽</p>
          <button class="btn" id="choose">Заказать</button>
        </div>

  </section>





  <footer class="footer-catalog">
    <div class="container">
      <div class="footerlog-content">
        <div class="footerlog-logo">
          <h3>Alfurat<span>.tj</span></h3>
           <p>© 2026 <span id="admin-trigger" style="cursor: pointer; color: inherit;">Alfurat.tj</span></p>
           <button id="admin-cabinet"  style="background: none; cursor: pointer; border: none; font-size: 14px; color: #777;"><a href="admin.html">Войти в админку</a></button>
        </div>
        <div class="footerlog-contacts">
          <h4>Контакты</h4>
          <p><i class="fas fa-phone"></i> +xxx xx xxx xxxx</p>
          <p><i class="fas fa-envelope"></i> youremail@mail.ru</p>
        </div>
      </div>
    </div>
  </footer>



  <div class="callback-form-container" id="callbackForm">
    <button type="button" class="close-btn" onclick="openModal()">×</button>
    <h2>Заказать звонок</h2>
    <p>Оставьте свои контактные данные, и мы перезвоним вам</p>


    <label class="form-group">
      Ваш заказ:
      <img id="modalProductImg" src="" style="max-width:100%;margin-bottom:15px;display:none;">
      <input type="hidden" name="Заказ" id="productImgUrl">
    </label>

    <label class="form-group">
      email:
      <input type="email" id="customerEmail" name="email">
    </label>

    <label class="form-group">
      номер телефона:
      <input type="tel" id="customerPhone" name="phone">
    </label>

    <label class="form-group">
      имя:
      <input type="text" id="customerName" name="name">
    </label>

    <label class="form-group">
      сообщение:
      <textarea id="customerMessage" name="message"></textarea>
    </label>

    <!-- your other form fields go here -->
    <button type="button" onclick="sendOrder(event)">Send</button>
  </div>

  <div id="login-modal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 10000; justify-content: center; align-items: center;">
    <div style="background: white; width: 90%; max-width: 400px; margin: 20% auto; padding: 30px; border-radius: 15px; text-align: center; margin-top: 10%;">
        <h2 style="margin-bottom: 20px;">Login</h2>
        <input type="text" id="adm-login" placeholder="Логин" style="width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px;">
        <input type="password" id="adm-pass" placeholder="Пароль" style="width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px;">
        <button id="do-login" style="width: 100%; padding: 12px; background: #8B5E3C; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer;">Войти в админку</button>
        <button onclick="document.getElementById('login-modal').style.display='none'" style="margin-top: 15px; background: none; border: none; color: #777; cursor: pointer;">Отмена</button>
    </div>
</div>

  <script src="catalog.js"></script>
  <script src="script.js"></script>
</body>

</html>
